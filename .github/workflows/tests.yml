name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行单元测试
        run: python -m unittest discover -s tests -v

  # 只挑"一定会让程序崩"的规则：语法错误、未定义名、重复参数等。
  # 不启用风格类规则，避免几万行存量代码一次报几百条把人淹没。
  static-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 ruff
        run: pip install ruff==0.17.1

      - name: 字节码编译
        run: python -m compileall -q unified release.py tests

      - name: 致命级静态检查
        run: ruff check --select E9,F63,F7,F82 --target-version py311 unified release.py tests

  # 打包验证只在发版 tag 或手动触发时跑（每次 PR 都打一次 exe 太慢）。
  # 目的：在真正发布前发现 spec 缺文件、依赖漏装、图标没打进去之类的问题。
  build:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    needs: [unit-tests, static-checks]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 安装依赖（含 PyInstaller）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 打包 exe
        run: python -m PyInstaller "统一工具箱.spec" --noconfirm --distpath dist --workpath build --log-level WARN

      - name: 校验产物大小并计算 SHA256
        shell: pwsh
        run: |
          $exe = Get-Item 'dist\统一工具箱.exe'
          Write-Host "exe size: $($exe.Length) bytes"
          if ($exe.Length -lt 10MB) { throw "exe too small ($($exe.Length) bytes): build is incomplete" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  UnifiedToolbox.exe" | Set-Content -Encoding ascii dist\sha256.txt
          Write-Host "sha256: $hash"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: UnifiedToolbox-unsigned
          path: |
            dist/统一工具箱.exe
            dist/sha256.txt
          if-no-files-found: error
